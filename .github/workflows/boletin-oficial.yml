name: Boletín Oficial diario

on:
  schedule:
    # 08:20 hora Argentina (UTC-3), lunes a viernes
    - cron: "20 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: estado-repo
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TZ: America/Argentina/Buenos_Aires
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q .
      - name: Ejecutar
        run: python -m licitaciones_ai boletin
      - name: Guardar estado y reportes
        if: always()
        run: |
          git config user.name "licitaciones-bot"
          git config user.email "licitaciones-bot@users.noreply.github.com"
          git add data reports knowledge/novedades_normativas.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Boletín Oficial diario: $(date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do git pull --rebase -q && git push && exit 0; sleep $((2**i)); done
          exit 1
      - name: Notificar alertas (issue de GitHub)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s out/alertas.md ]; then
            gh label create alerta --color D93F0B --force >/dev/null
            gh issue create --title "🔔 Boletín Oficial diario — $(date '+%Y-%m-%d %H:%M')" --body-file out/alertas.md --label alerta
          fi
