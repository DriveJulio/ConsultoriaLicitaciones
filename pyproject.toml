[project]
name = "licitaciones-ai"
version = "0.1.0"
description = "Sistema agéntico de IA para licitaciones y contrataciones públicas en Argentina"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.4.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
licitaciones = "licitaciones_ai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
